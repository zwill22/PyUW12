version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: latest
  jobs:
    pre_build:
      - pip install pip-tools
      - pip-compile --extra doc --output-file=docs/requirements.txt pyproject.toml 

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
